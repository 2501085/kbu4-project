<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강사진</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- DEAL(상단) 부분은 다른 팀원이 여기에 추가 -->


    <!-- ===== TANK (중단) ===== -->
    <div class="tank-section">

        <!--이 부분은 강사진 안내 제목을 포함합니다-->
        <h2 class="tank-title">디바팀 강사 안내</h2>

        <!--이 부분은 TANK 글자를 포함합니다-->
        <div class="tank-logo">TANK</div>

        <!--이 부분은 강사 사진 4칸을 포함합니다 (가로 2 x 세로 2)-->
        <!--images 폴더에 tank1.jpg ~ tank4.jpg 를 넣으면 사진이 나옵니다-->
        <div class="tank-grid">
            <div class="tank-card"><img src="../images/tank1.jpg" alt="탱커 강사 1"></div>
            <div class="tank-card"><img src="../images/tank2.jpg" alt="탱커 강사 2"></div>
            <div class="tank-card"><img src="../images/tank3.jpg" alt="탱커 강사 3"></div>
            <div class="tank-card"><img src="../images/tank4.jpg" alt="탱커 강사 4"></div>
        </div>

    </div>


    <!-- HEAL(하단) 부분은 다른 팀원이 여기에 추가 -->

</body>
</html>
