<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CONSULT</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="consult">

    <h1>CONSULT</h1>
    <h3>SGA서울게임아카데미 | 1:1온라인 맞춤 교육 상담</h3>

    <hr>

    <div class="info">

        <div>
            <label>이름</label>
            <input type="text">
        </div>

        <div>
            <label>연락처</label>
            <input type="text">
        </div>

        <div>
            <label>통화가능 시간</label>
            <select>
                <option>언제든지 가능함</option>
                <option>오전</option>
                <option>오후</option>
                <option>저녁</option>
            </select>
        </div>

    </div>

    <hr>

    <p>상담 지점 선택</p>

    <div class="radio">
        <label><input type="radio" name="place"> SGA 종로</label>
        <label><input type="radio" name="place"> SGA 부산</label>
        <label><input type="radio" name="place"> SGA 구로</label>
        <label><input type="radio" name="place"> SGA 성남</label>
        <label><input type="radio" name="place"> SGA 일산</label>
        <label><input type="radio" name="place"> SGA 수원</label>
    </div>

    <hr>

    <p>모집분야 선택</p>

    <div class="check-list">
        <label><input type="checkbox"> 게임개발자</label>
        <label><input type="checkbox"> 프로게이머(데뷔반) / 티어상승(취미반)</label>
        <label><input type="checkbox"> e스포츠</label>
        <label><input type="checkbox"> 웹컨텐츠</label>
        <label><input type="checkbox"> 국비지원과정</label>
        <label><input type="checkbox"> 고교 위탁교육</label>
        <label><input type="checkbox"> 혁신기술</label>
    </div>

    <hr>

    <p>※ 빠르고 정확한 상담을 위해 궁금한 내용이 있으면 적어주세요.</p>

    <textarea></textarea>

    <div class="agree">
        <label>
            <input type="checkbox"> 개인정보취급방침에 동의합니다.
        </label>
    </div>

    <button>신청하기</button>

</div>

</body>
</html>
